 const qT=diceQ(n),A=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),qs=new THREE.Quaternion();
 dice.visible=true;
 await tween(1300,u=>{const e=1-Math.pow(1-u,3);qs.setFromAxisAngle(A,(1-e)*18);dice.quaternion.copy(qT).premultiply(qs);dice.position.set(b.x,b.y+Math.abs(Math.sin(u*7.85))*(1-u)*1.8,b.z)});
 await sleep(550);dice.visible=false;
}
function resize3(){if(!R)return;R.setSize(innerWidth,innerHeight,false);if(COMP)COMP.setSize(innerWidth,innerHeight);CAM.aspect=innerWidth/innerHeight;CAM.updateProjectionMatrix()}
function snapCam(){tgt.copy(pawns[cur].position);cdi=dist;cel=el}
function boot3d(){
 try{
  if(!window.THREE)throw 0;
  if(!world){const g=GFX[gq];R=new THREE.WebGLRenderer({canvas:$("cv"),antialias:true,powerPreference:"high-performance"});R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.2;R.shadowMap.type=THREE.PCFSoftShadowMap;R.shadowMap.enabled=!!g.sh;R.setPixelRatio(Math.min(devicePixelRatio||1,g.pr));R.setSize(innerWidth,innerHeight,false);buildWorld();world=true;addEventListener("resize",resize3);requestAnimationFrame(loop);
   $("cv").addEventListener("webglcontextlost",e=>{e.preventDefault();world=false;$("cd").innerHTML=`<h3>O gráfico foi interrompido</h3><p>Isso acontece em alguns celulares quando falta memória. Recarregue o jogo e tente com gráficos mais leves.</p><button class="opt" id="rl">Recarregar</button>`;$("mo").hidden=false;$("rl").onclick=()=>location.reload()})}
  setPawns(N);fpsT=fpsN=0;lowN=2;return true
 }catch(e){
  $("cd").innerHTML=`<h3>Não foi possível iniciar o 3D</h3><p>Verifique a internet ou se o navegador suporta WebGL.</p><button class="opt" id="bk">Voltar</button>`;$("mo").hidden=false;$("bk").onclick=()=>{$("mo").hidden=true};return false}
}
function loop(now){
 requestAnimationFrame(loop);
 if(!world||$("s3").hidden||document.hidden){last=now;return}
 const raw=(now-last)/1000||.016,t=now/1000,dt=Math.min(raw,.05);last=now;
 for(let i=tw.length;i--;){const w=tw[i],u=Math.min((now-w.t0)/w.d,1);w.f(u);if(u>=1){tw.splice(i,1);w.r()}}
 anim.forEach(f=>f(t,dt));
 tgt.lerp(ov?V.set(0,0,-7.5*TZ):pawns[cur].position,1-Math.exp(-dt*(ov?2:5)));
 cdi+=((ov?64:dist)-cdi)*(1-Math.exp(-dt*3));cel+=((ov?1.1:el)-cel)*(1-Math.exp(-dt*3));
 const ca=Math.cos(cel);CAM.position.set(tgt.x+Math.sin(az)*ca*cdi,tgt.y+Math.sin(cel)*cdi+.6,tgt.z+Math.cos(az)*ca*cdi);CAM.lookAt(tgt.x,tgt.y+.4,tgt.z-.8);
 SUN.position.set(tgt.x+9,tgt.y+17,tgt.z+7);SUN.target.position.copy(tgt);
 ring.position.copy(P3(pos[cur]));ring.position.y+=.03;ring.scale.setScalar(1+Math.sin(t*4)*.12);
 if(COMP)COMP.render(dt);else R.render(S,CAM);
}
const ptr=new Map();let pd=0;
$("cv").onpointerdown=e=>{$("cv").setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY])};
$("cv").onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;
 if(ptr.size===1){az-=(e.clientX-o[0])*.006;el=clamp(el+(e.clientY-o[1])*.004,.2,1.25)}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)dist=clamp(dist*pd/d,8,24);pd=d}};
$("cv").onpointerup=$("cv").onpointercancel=e=>{ptr.delete(e.pointerId);pd=0};
$("cv").onwheel=e=>{dist=clamp(dist+e.deltaY*.01,8,24)};
$("ov").onclick=()=>{ov=!ov;if(!ov)az=0;$("ov").style.background=ov?"#f59e0b":"";snd(500,.08,"triangle")};
async function wake(){try{if(navigator.wakeLock&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>WL=null)}}catch(e){}}
function unwake(){try{WL&&WL.release();WL=null}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("s3").hidden)wake()});
/* ===== ONLINE (salas + voz) ===== */
let MP=null,gone=[];
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}],CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const rcode=()=>Array.from({length:4},()=>CH[Math.floor(Math.random()*CH.length)]).join("");
const newMP=()=>({host:false,idx:0,ids:[],conns:[],conn:null,peer:null,code:"",started:false,pending:false,q:Promise.resolve(),vr:new Set(),calls:{},auds:{},mic:null,vs:null,muted:false,cardOpen:false,onAns:null,pendAns:undefined});
const lmsg=t=>{$("lmsg").textContent=t||""};
const note=t=>$("s4").hidden?msg(t):lmsg(t);
const turnTxt=()=>`Vez do Jogador ${cur+1}${MP&&MP.idx===cur?" — é a sua vez!":""}`;
const nextActive=c=>{let k=(c+1)%N;while(gone[k])k=(k+1)%N;return k};
function mpAlert(t){$("cd").innerHTML=`<h3>${t}</h3><button class="opt" id="okb">OK</button>`;$("mo").hidden=false;$("okb").onclick=()=>{$("mo").hidden=true}}
function syncRb(){$("rb").disabled=!!(busy||(MP&&MP.idx!==cur))}
function updVm(){$("vm").textContent=!MP||!MP.vs?"🎧":MP.muted?"🔇":"🎤"}
function bc(m){MP.conns.forEach(c=>{try{c.open&&c.send(m)}catch(e){}});onMsg(m)}
function mpClose(){
 const m=MP;if(!m)return;MP=null;
 try{Object.values(m.calls).forEach(c=>c.close())}catch(e){}
 Object.values(m.auds).forEach(a=>a.remove());
 try{m.mic&&m.mic.getTracks().forEach(t=>t.stop())}catch(e){}
 try{m.peer&&m.peer.destroy()}catch(e){}
 $("vm").hidden=true;
}
function lobbyUI(){show("s4");$("l1").hidden=true;$("l2").hidden=false;$("rcode").textContent=MP.code;renderLobby()}
function renderLobby(){
 $("rl").innerHTML=MP.ids.map((id,i)=>`<div class="p${i===MP.idx?" me":""}" style="--c:${COL[i]}">${tok(i)}<span>Jogador ${i+1}${i===0?" (criador)":""}${i===MP.idx?" · você":""}${MP.vr.has(i)?" 🎤":""}</span></div>`).join("");
 $("mkstart").hidden=!MP.host;$("mkstart").disabled=MP.ids.length<2;$("lwait").hidden=MP.host;
 $("vbtn").textContent=MP.vs?"🎤 Voz ligada":"🎧 Entrar na voz";
}
function onMsg(m){
 if(!MP)return;
 if(m.t==="lobby"){MP.ids=m.ids;MP.idx=m.ids.indexOf(MP.peer.id);(m.vr||[]).forEach(i=>MP.vr.add(i));if(!MP.started){$("l2").hidden?lobbyUI():renderLobby()}syncCalls()}
 else if(m.t==="start"){MP.started=true;N=m.N;gone=Array(N).fill(false);MP.pending=false;MP.q=Promise.resolve();start()}
 else if(m.t==="turn"){MP.pendAns=undefined;MP.q=MP.q.then(()=>turn({n:m.n,card:m.card}))}
 else if(m.t==="ans"){if(MP.onAns){const f=MP.onAns;MP.onAns=null;f(m.x)}else MP.pendAns=m.x}
 else if(m.t==="left"){gone[m.i]=true;dropCall(m.i);render();msg(`Jogador ${m.i+1} saiu da sala`);if(MP.host&&m.i===cur){if(MP.cardOpen)bc({t:"ans",x:""});else if(!MP.pending)bc({t:"adv"})}}
 else if(m.t==="adv"){cur=nextActive(cur);render();msg(turnTxt());syncRb()}
 else if(m.t==="vr"){MP.vr.add(m.i);if(!MP.started)renderLobby();syncCalls()}
}
function rollClick(){
 if(!MP){turn();return}
 if(busy||MP.pending||!MP.started)return;
 if(MP.idx!==cur){msg(`Aguarde: vez do Jogador ${cur+1}`);return}
 $("rb").disabled=true;setTimeout(syncRb,2000);
 if(MP.host)hostRoll();else MP.conn.send({t:"roll"})
}
function hostRoll(){
 if(MP.pending)return;MP.pending=true;
 bc({t:"turn",n:1+Math.floor(Math.random()*6),card:Math.floor(Math.random()*Q.length)});
 MP.q=MP.q.then(()=>{MP.pending=false})
}
function mpAns(x){if(MP.host)bc({t:"ans",x});else MP.conn.send({t:"ans",x})}
function hostMsg(c,m){
 const i=MP&&MP.conns.indexOf(c)+1;if(!i||!m)return;
 if(m.t==="roll"){if(i===cur&&!MP.pending&&!busy&&MP.started)hostRoll()}
 else if(m.t==="ans"){if(i===cur)bc({t:"ans",x:m.x})}
 else if(m.t==="vr")bc({t:"vr",i})
}
function lobbyBc(){MP.ids=[MP.peer.id,...MP.conns.map(c=>c.peer)];bc({t:"lobby",ids:MP.ids,vr:[...MP.vr]})}
function hostConn(c){
 c.on("open",()=>{
  if(!MP)return;
  if(MP.started||MP.conns.length>=4){try{c.send({t:"full"})}catch(e){}setTimeout(()=>c.close(),400);return}
  MP.conns.push(c);lobbyBc()});
 c.on("data",m=>hostMsg(c,m));c.on("close",()=>hostLeave(c));c.on("error",()=>hostLeave(c));
}
function hostLeave(c){
 if(!MP)return;const k=MP.conns.indexOf(c);if(k<0)return;
 if(!MP.started){MP.conns.splice(k,1);lobbyBc();return}
 if(!gone[k+1])bc({t:"left",i:k+1})
}
function roomClosed(){if(!MP)return;show("s1");mpAlert("A sala foi encerrada.")}
function mpCreate(){
 if(!window.Peer){lmsg("Não foi possível carregar o modo online. Verifique a internet.");return}
 MP=newMP();MP.host=true;let tries=0;
 const open=()=>{
  MP.code=rcode();const p=new Peer("mvadv-"+MP.code,{config:{iceServers:ICE}});MP.peer=p;
  p.on("open",id=>{MP.ids=[id];MP.idx=0;lobbyUI()});
  p.on("connection",hostConn);p.on("call",onCall);
  p.on("error",e=>{if(e.type==="unavailable-id"&&tries++<5){try{p.destroy()}catch(x){}open()}else note("Erro de conexão: "+(e.type||"desconhecido"))});
  p.on("disconnected",()=>{if(!p.destroyed)try{p.reconnect()}catch(x){}});
 };open()
}
function mpJoin(code){
 if(!window.Peer){lmsg("Não foi possível carregar o modo online. Verifique a internet.");return}
 code=String(code||"").trim().toUpperCase();
 if(code.length!==4){lmsg("Digite o código de 4 caracteres.");return}
 MP=newMP();MP.code=code;lmsg("Conectando…");
 const p=new Peer({config:{iceServers:ICE}});MP.peer=p;const me=MP;
 p.on("open",()=>{const c=p.connect("mvadv-"+code,{reliable:true});me.conn=c;
  c.on("open",()=>lmsg(""));
  c.on("data",m=>{if(m&&m.t==="full"){lmsg("A sala está cheia ou a partida já começou.");mpClose();return}onMsg(m)});
  c.on("close",roomClosed);c.on("error",roomClosed)});
 p.on("call",onCall);
 p.on("error",e=>{lmsg(e.type==="peer-unavailable"?"Sala não encontrada. Confira o código.":"Erro de conexão: "+(e.type||"desconhecido"))});
 setTimeout(()=>{if(MP===me&&!(me.conn&&me.conn.open))lmsg("Não foi possível conectar. A rede pode bloquear conexões diretas.")},12000);
}
async function voiceStart(){
 if(!MP||MP.vs)return;let s=null;
 try{s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});if(MP)MP.mic=s}
 catch(e){note("Microfone indisponível. Você vai só ouvir os outros.");try{const ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();s=ac.createMediaStreamDestination().stream}catch(x){return}}
 if(!MP)return;MP.vs=s;
 if(MP.host)bc({t:"vr",i:0});else MP.conn.send({t:"vr"});
 updVm();if(!MP.started)renderLobby();
}
function syncCalls(){
 if(!MP||!MP.vs||!MP.peer)return;
 MP.vr.forEach(j=>{if(j<MP.idx&&MP.ids[j]&&!MP.calls[j])hookCall(j,MP.peer.call(MP.ids[j],MP.vs))})
}
function hookCall(j,call){MP.calls[j]=call;call.on("stream",s=>playRemote(j,s));call.on("close",()=>dropCall(j));call.on("error",()=>{note(`Falha na voz com o Jogador ${j+1}`);dropCall(j)})}
function onCall(call){
 const j=MP?MP.ids.indexOf(call.peer):-1;
 if(!MP||!MP.vs||j<0||MP.calls[j]){try{call.close()}catch(e){}return}
 call.answer(MP.vs);hookCall(j,call)
}
function playRemote(j,s){
 if(!MP)return;if(MP.auds[j])MP.auds[j].remove();
 const a=document.createElement("audio");a.autoplay=true;a.playsInline=true;a.srcObject=s;document.body.appendChild(a);MP.auds[j]=a;
 try{const r=a.play();r&&r.catch&&r.catch(()=>{note("Toque na tela para ativar o som da voz");document.addEventListener("click",()=>{a.play&&a.play()},{once:true})})}catch(e){}
 note(`🎧 Voz conectada com o Jogador ${j+1}`);
}
function dropCall(j){if(!MP)return;try{MP.calls[j]&&MP.calls[j].close()}catch(e){}delete MP.calls[j];if(MP.auds[j]){MP.auds[j].remove();delete MP.auds[j]}}
$("goon").onclick=()=>{lock();show("s4");$("l1").hidden=false;$("l2").hidden=true;lmsg("")};
$("mkroom").onclick=()=>{lmsg("Criando sala…");mpCreate()};
$("joinroom").onclick=()=>mpJoin($("rc").value);
$("mkstart").onclick=()=>{if(MP&&MP.host&&MP.ids.length>=2&&!MP.started){MP.started=true;bc({t:"start",N:MP.ids.length})}};
$("lback").onclick=()=>{mpClose();show("s1")};
$("vbtn").onclick=()=>voiceStart();
$("vm").onclick=()=>{if(!MP)return;if(!MP.vs){voiceStart();return}MP.muted=!MP.muted;if(MP.mic)MP.mic.getAudioTracks().forEach(t=>t.enabled=!MP.muted);updVm()};
</script>
